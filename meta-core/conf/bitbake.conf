# BitBake基础配置文件
# 基础构建配置
BUILD_ARCH = "${@os.uname()[4]}"
BUILD_OS = "${@os.uname()[0].lower()}"
BUILD_VENDOR = ""
BUILD_SYS = "${BUILD_ARCH}${BUILD_VENDOR}-${BUILD_OS}"

# 工作目录配置
TMPDIR ?= "${TOPDIR}/tmp"
CACHE = "${TMPDIR}/cache"
STAMP = "${TMPDIR}/stamps/${MULTIMACH_TARGET_SYS}/${PN}/${EXTENDPE}${PV}-${PR}"
WORKDIR = "${TMPDIR}/work/${MULTIMACH_TARGET_SYS}/${PN}/${EXTENDPE}${PV}-${PR}"
T = "${WORKDIR}/temp"
D = "${WORKDIR}/image"
S = "${WORKDIR}/${BP}"
B = "${S}"

# 基础变量定义
BP = "${BPN}-${PV}"
BPN = "${@bb.parse.vars_from_file(d.getVar('FILE', False),d)[0] or 'defaultpkgname'}"
PV = "${@bb.parse.vars_from_file(d.getVar('FILE', False),d)[1] or '1.0'}"
PR = "r0"
PF = "${PN}-${EXTENDPE}${PV}-${PR}"
EXTENDPE = "${@['','${PE}_'][int(d.getVar('PE') or 0) > 0]}"
PE = ""
PN = "${@bb.parse.vars_from_file(d.getVar('FILE', False),d)[0] or 'defaultpkgname'}"

# 目标系统设置
TARGET_ARCH ?= "${MACHINE_ARCH}"
TARGET_OS = "linux"
TARGET_VENDOR = ""
TARGET_SYS = "${TARGET_ARCH}${TARGET_VENDOR}-${TARGET_OS}"
TARGET_PREFIX = "${TARGET_SYS}-"
MULTIMACH_TARGET_SYS = "${MACHINE_ARCH}${TARGET_VENDOR}-${TARGET_OS}"

# 机器架构设置
MACHINE_ARCH = "${MACHINE}"
PACKAGE_ARCH = "${MACHINE_ARCH}"

# 包管理
PACKAGE_CLASSES ?= "package_tar"

# 下载目录
DL_DIR ?= "${TOPDIR}/downloads"
SSTATE_DIR ?= "${TOPDIR}/sstate-cache"

# 并行设置
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

# 导入Python模块
DEPENDS:prepend = "python3-native "

# 基础任务
BB_DEFAULT_TASK ?= "build"

# 文件权限
FILESYSTEM_PERMS_TABLES = ""

# 许可证目录
COMMON_LICENSE_DIR = "${SMART_BUILD_ROOT}/meta-core/licenses"

# 系统目录变量
prefix = "/usr"
exec_prefix = "${prefix}"
bindir = "${exec_prefix}/bin"
sbindir = "${exec_prefix}/sbin"
libdir = "${exec_prefix}/lib"
includedir = "${prefix}/include"
sysconfdir = "/etc"
localstatedir = "/var"
datadir = "${prefix}/share"

# 基础包含路径
include conf/machine/${MACHINE}.conf
include conf/distro/${DISTRO}.conf 