#@TYPE: Distribution
#@NAME: Smart
#@DESCRIPTION: RT-Smart Distribution

DISTRO = "smart"
DISTRO_NAME = "RT-Smart"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "smart"

MAINTAINER = "RT-Thread Team <support@rt-thread.org>"

# Feature settings
DISTRO_FEATURES = "largefile multiarch"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "pulseaudio sysvinit"

# Toolchain settings
TCMODE ?= "default"
GCCVERSION ?= "11.%"

# Package management
PACKAGE_CLASSES ?= "package_tar"

# Init system
INIT_MANAGER = "none"

# Security flags - 为RT-Smart环境禁用复杂的安全检查
SECURITY_CFLAGS = ""
SECURITY_LDFLAGS = ""

# 默认的C库设置
TCLIBC = "musl"

# 禁用一些不需要的特性
DISTRO_FEATURES_remove = "x11 wayland vulkan opengl ptest multiarch" 