#@TYPE: Machine
#@NAME: QEMU RISC-V 64-bit machine
#@DESCRIPTION: Machine configuration for RISC-V 64-bit on QEMU

MACHINE_ARCH = "riscv64"
DEFAULTTUNE = "riscv64"

KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES ?= "115200;ttyS0"

MACHINE_FEATURES = "kernel26 usbgadget usbhost vfat"

# Toolchain settings
TOOLCHAIN_HOST_TASK ?= ""
TOOLCHAIN_TARGET_TASK ?= ""

# RT-Smart specific settings
RTSMART_BSP = "qemu-virt64-riscv"
RTSMART_ARCH = "riscv64"
RTSMART_TOOLCHAIN = "riscv64-linux-musleabi"
RTSMART_TOOLCHAIN_PREFIX = "riscv64-linux-musleabi-"

# Cross compilation settings
TARGET_CC_ARCH = "-march=rv64imafdc"
TUNE_CCARGS = "-march=rv64imafdc" 